<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Nidaam">
  <!-- Nidaam brand mark - "reversed" variant for use on the primary purple
       gradient (login aside, dark surfaces) where the standard purple-
